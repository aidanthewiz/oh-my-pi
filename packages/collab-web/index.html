<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf7fc" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0b14" />

		<title>Coreforce Agent Collab — secure agent session in your browser</title>
		<meta
			name="description"
			content="Guest client for Coreforce agent collaboration sessions: watch a live session, inspect tool calls and subagents, and prompt the host from any browser. End-to-end encrypted; the room key never leaves the URL fragment."
		/>
		<meta name="author" content="Coreforce" />
		<link rel="canonical" href="https://agent-collab.internal.somahub.io/" />
		<meta name="robots" content="noindex, nofollow, noarchive" />

		<link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
		<link rel="icon" type="image/x-icon" href="./public/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="256x256" href="./public/favicon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="./public/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="./public/favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="./public/favicon-180x180.png" />
		<link rel="manifest" href="./public/manifest.webmanifest" />

		<!-- Open Graph -->
		<meta property="og:site_name" content="Coreforce" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://agent-collab.internal.somahub.io/" />
		<meta property="og:title" content="Coreforce Agent Collab" />
		<meta
			property="og:description"
			content="Watch a secure agent session and prompt the host from any browser. The encryption key stays in the URL fragment."
		/>
		<meta property="og:locale" content="en_US" />

		<!-- Twitter / X -->
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:url" content="https://agent-collab.internal.somahub.io/" />
		<meta name="twitter:title" content="Coreforce Agent Collab" />
		<meta
			name="twitter:description"
			content="Watch a secure agent session and prompt the host from any browser. The encryption key stays in the URL fragment."
		/>


	</head>
	<body>
		<div id="root"></div>
		<script>(function(){try{var s=localStorage.getItem("omp-collab-theme");var sys=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";var t=(s==="light"||s==="dark")?s:sys;document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;}catch(e){}})();</script>
		<script type="module" src="./src/main.tsx"></script>
	</body>
</html>
