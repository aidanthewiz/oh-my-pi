# Coreforge engine release - builds omp binaries from the patched coreforge
# branch and publishes them as GitHub Releases on this private mirror.
# Employees' `omp update` (patched to the cf channel, see
# packages/coding-agent/src/cli/cf-channel.ts) pulls from these releases.
# Coreforge appliances install the exact release selected by `engine.lock`.
#
# Trigger: coreforge branch updates associated with merged pull requests build
# the latest tip. Newer merges cancel superseded per-target builds before the
# winning run allocates the next `v<upstream>.<roll>` tag and publishes it.
# Direct branch updates do not publish; a manually pushed four-segment tag
# remains the recovery path. The first three segments MUST match
# packages/coding-agent/package.json; the fourth is the Coreforge patch roll.
# Engine releases are channel-neutral dependency artifacts. Coreforge's
# independent beta-first product release and stable promotion gates decide
# which exact engine.lock pin employees receive.
#
# Build reuses upstream's release tooling (`bun run ci:release:build-binaries`
# = scripts/ci-release-build-binaries.ts): per-target native embed, correct
# bun target names, initial Darwin ad-hoc signing, and asset names matching
# `getBinaryName()` in `update-cli.ts`. When every `APPLE_*` secret exists, the
# workflow replaces Darwin signatures with notarized Developer ID signatures.
# Darwin builds run natively on macOS; Linux, Linux musl, and Windows x64
# run on Linux/ARM runners as appropriate; Windows ARM64 runs on Windows ARM.
# Native addons are built from this fork's source for every target. This keeps
# release binaries aligned with Coreforge native adaptations instead of
# silently substituting upstream npm prebuilts.
#
# This file lives only on the coreforge branch (never on main, which mirrors
# upstream), so upstream syncs merge it forward like any other fork change.
name: cf-release

on:
  push:
    branches:
      - coreforge
    tags:
      - "v*.*.*.*"

permissions:
  contents: read
  pull-requests: read

# Cancel superseded preparation, cache restores, builds, and smoke jobs.
# Serialize publication so later merges cannot interrupt tags or asset uploads.
# Only initial branch runs share cancellation lanes. Isolate retries and
# recovery tags so stale work cannot cancel current pre-publication jobs.

jobs:
  prepare:
    runs-on: ubuntu-24.04
    concurrency:
      group: cf-release-prepare-${{ github.ref_type == 'branch' && github.run_attempt == 1 && 'latest' || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      should_release: ${{ steps.release.outputs.should_release }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          git fetch origin +coreforge:refs/remotes/origin/coreforge --tags --force --quiet
          TIP="$(git rev-parse refs/remotes/origin/coreforge)"
          PKG="$(bun -e 'console.log(JSON.parse(await Bun.file("packages/coding-agent/package.json").text()).version)')"

          if [ "$EVENT_REF_TYPE" = "tag" ]; then
            TAG="$EVENT_REF_NAME"
            RELEASE_SHA="$(git rev-parse "$TAG^{commit}")"
            EVENT_COMMIT="$(git rev-parse --verify "$EVENT_SHA^{commit}")"
            if [ "$RELEASE_SHA" != "$EVENT_COMMIT" ]; then
              echo "tag $TAG now identifies $RELEASE_SHA, not event commit $EVENT_COMMIT - refusing to release"
              exit 1
            fi
            if [ "$RELEASE_SHA" != "$TIP" ]; then
              echo "tag commit $RELEASE_SHA is not the coreforge tip ($TIP) - refusing to release"
              exit 1
            fi
          else
            if [ "$EVENT_SHA" != "$TIP" ]; then
              echo "coreforge advanced from $EVENT_SHA to $TIP - a newer run will publish the tip"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # coreforge-cache-publication:start
            RELEASE_LIST="$(mktemp)"
            trap 'rm -f "$RELEASE_LIST"' EXIT
            gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 \
              --json tagName,isDraft > "$RELEASE_LIST"
            PUBLISHED_TAG="$(bun scripts/ci-released-native.ts resolve-optional "$PKG" "$RELEASE_LIST")"
            SHOULD_RELEASE="$(python3 scripts/ci_cache_release.py "$EVENT_SHA" --published-ref "$PUBLISHED_TAG")"
            if [ "$SHOULD_RELEASE" = "false" ]; then
              echo "$EVENT_SHA has only non-artifact changes since $PUBLISHED_TAG - no engine release"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # coreforge-cache-publication:end

            ADMISSION="$(python3 scripts/ci_release_admission.py "$EVENT_SHA")"
            case "$ADMISSION" in
              true) ;;
              false)
                echo "should_release=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              *) echo "invalid automatic release admission: $ADMISSION"; exit 1 ;;
            esac

            LAST=0
            RESUME_TAG=""
            while IFS= read -r candidate; do
              roll="${candidate#v"${PKG}".}"
              case "$candidate" in
                "v${PKG}."[1-9]*) ;;
                *) continue ;;
              esac
              case "$roll" in
                *[!0-9]*) continue ;;
              esac
              if [ "$roll" -gt "$LAST" ]; then LAST="$roll"; fi

              candidate_commit="$(git rev-parse "$candidate^{commit}")"
              if [ "$candidate_commit" = "$EVENT_SHA" ] &&
                 ! gh release view "$candidate" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                if [ -n "$RESUME_TAG" ]; then
                  echo "multiple unpublished release tags point at $EVENT_SHA: $RESUME_TAG and $candidate"
                  exit 1
                fi
                RESUME_TAG="$candidate"
              fi
            done < <(git tag --list "v${PKG}.*")

            if [ -n "$RESUME_TAG" ]; then
              TAG="$RESUME_TAG"
              echo "resuming unpublished release tag $TAG"
            else
              TAG="v${PKG}.$((LAST + 1))"
            fi
            RELEASE_SHA="$EVENT_SHA"
          fi

          ROLL="${TAG#v"${PKG}".}"
          case "$TAG" in
            "v${PKG}."[1-9]*) ;;
            *) echo "tag $TAG does not extend package version $PKG"; exit 1 ;;
          esac
          case "$ROLL" in
            *[!0-9]*) echo "tag $TAG has a non-numeric roll"; exit 1 ;;
          esac
          echo "release tag: $TAG"
          {
            echo "release_tag=$TAG"
            echo "should_release=true"
            echo "release_sha=$RELEASE_SHA"
          } >> "$GITHUB_OUTPUT"

  cache_restore:
    concurrency:
      group: cf-release-cache-restore-${{ github.ref_type == 'branch' && github.run_attempt == 1 && 'latest' || github.run_id }}
      cancel-in-progress: true
    needs: prepare
    if: vars.CI_CACHE_ENABLED == 'true' && needs.prepare.outputs.should_release == 'true'
    uses: Coreforce-CAD/oh-my-pi/.github/workflows/cf-cache-read.yml@c4d074b6ef60c229874d0fda96740cd71877f94c
    with:
      enabled: true
      slots: '["darwin-arm64-xcode-27","darwin-x64-macos-15-intel","linux-x64-ubuntu-22.04","linux-arm64-ubuntu-24.04-arm","linux-musl-x64-ubuntu-22.04","linux-musl-arm64-ubuntu-24.04-arm","win32-x64-ubuntu-24.04"]'
    permissions:
      contents: read
      actions: read
      id-token: write

  build:
    name: build (${{ matrix.target }})
    needs: [prepare, cache_restore]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.should_release == 'true' }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
    concurrency:
      group: cf-release-build-${{ matrix.target }}-${{ github.ref_type == 'branch' && github.run_attempt == 1 && 'latest' || github.run_id }}
      cancel-in-progress: true
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY != '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: xcode-27
            binary: omp-darwin-arm64
            native_targets: darwin-arm64
          - target: darwin-x64
            os: macos-15-intel
            binary: omp-darwin-x64
            native_targets: darwin-x64-baseline
          - target: linux-x64
            os: ubuntu-22.04
            binary: omp-linux-x64
            native_targets: "linux-x64-baseline linux-x64-modern"
          - target: linux-arm64
            os: ubuntu-24.04-arm
            binary: omp-linux-arm64
            native_targets: linux-arm64
          - target: linux-musl-x64
            os: ubuntu-22.04
            cross: "1"
            binary: omp-linux-musl-x64
            native_targets: linux-musl-x64-baseline
          - target: linux-musl-arm64
            os: ubuntu-24.04-arm
            cross: "1"
            binary: omp-linux-musl-arm64
            native_targets: linux-musl-arm64
          - target: win32-x64
            os: ubuntu-24.04
            cross: "1"
            binary: omp-windows-x64.exe
            native_targets: win32-x64-baseline
          - target: win32-arm64
            os: windows-11-arm
            windows: "1"
            binary: omp-windows-arm64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_sha }}
      - name: Guard release commit is the coreforge branch tip
        if: matrix.windows != '1'
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          git fetch origin +coreforge:refs/remotes/origin/coreforge --quiet
          HEAD_COMMIT="$(git rev-parse HEAD)"
          TIP="$(git rev-parse refs/remotes/origin/coreforge)"
          if [ "$HEAD_COMMIT" != "$RELEASE_SHA" ]; then
            echo "checkout $HEAD_COMMIT does not match prepared commit $RELEASE_SHA"
            exit 1
          fi
          if [ "$RELEASE_SHA" != "$TIP" ]; then
            echo "prepared commit $RELEASE_SHA is not the coreforge tip ($TIP) - refusing to release"
            exit 1
          fi
          echo "release commit $RELEASE_SHA is the coreforge tip - ok"
      - name: Guard release commit is the coreforge branch tip (Windows)
        if: matrix.windows == '1'
        shell: pwsh
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          git fetch origin +coreforge:refs/remotes/origin/coreforge --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $headCommit = (git rev-parse HEAD).Trim()
          $tip = (git rev-parse refs/remotes/origin/coreforge).Trim()
          if ($headCommit -ne $env:RELEASE_SHA) {
            throw "checkout $headCommit does not match prepared commit $env:RELEASE_SHA"
          }
          if ($env:RELEASE_SHA -ne $tip) {
            throw "prepared commit $env:RELEASE_SHA is not the coreforge tip ($tip) - refusing to release"
          }
          Write-Host "release commit $env:RELEASE_SHA is the coreforge tip - ok"
      - name: Require Apple Foundation Models toolchain
        if: matrix.target == 'darwin-arm64'
        run: |
          toolchain="$(/bin/sh crates/natives/src/applefm/build-bridge.sh detect)"
          if [ -z "$toolchain" ]; then
            echo "::error::Darwin ARM64 release requires Swift 6.4+ and macOS 27 SDK; refusing an addon without the Apple Foundation Models bridge"
            exit 1
          fi
          printf 'Apple Foundation Models bridge: %s\n' "$toolchain"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Guard tag against package version
        if: matrix.windows != '1'
        run: |
          TAG="${RELEASE_TAG#v}"
          PKG="$(bun -e 'console.log(JSON.parse(await Bun.file("packages/coding-agent/package.json").text()).version)')"
          case "$TAG" in
            "$PKG".*) echo "tag $TAG rolls upstream $PKG - ok" ;;
            *) echo "tag $TAG does not extend package version $PKG"; exit 1 ;;
          esac
      - name: Guard tag against package version (Windows)
        if: matrix.windows == '1'
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG.Substring(1)
          $pkg = (bun -e 'console.log(JSON.parse(await Bun.file("packages/coding-agent/package.json").text()).version)').Trim()
          if (-not $tag.StartsWith("$pkg.")) {
            throw "tag $tag does not extend package version $pkg"
          }
          Write-Host "tag $tag rolls upstream $pkg - ok"
      - name: Reclaim disk for large native builds
        if: matrix.target == 'win32-x64' || matrix.target == 'linux-x64' || matrix.target == 'linux-musl-x64'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /
      - run: bun install --frozen-lockfile
      - name: Identify compatible Bazel caches
        if: matrix.windows != '1'
        id: cache-identity
        continue-on-error: true
        run: python3 scripts/ci_cache.py identity --slot "${{ matrix.target }}-${{ matrix.os }}" --output "$RUNNER_TEMP/cache-identity.json"
      - name: Restore verified merged-PR cache
        if: matrix.windows != '1' && vars.CI_CACHE_ENABLED == 'true' && steps.cache-identity.outcome == 'success'
        id: pr-cache
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci_cache_pr.py restore --source "${{ needs.prepare.outputs.release_sha }}" \
            --identity "$RUNNER_TEMP/cache-identity.json" \
            --disk "$HOME/.cache/omp-bazel-disk" --repo "$HOME/.cache/omp-bazel-repo"
      - name: Download durable Bazel snapshot
        if: matrix.windows != '1' && vars.CI_CACHE_ENABLED == 'true' && steps.pr-cache.outputs.hit != 'true'
        id: cache-download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cache-restore-${{ matrix.target }}-${{ matrix.os }}
          path: ${{ runner.temp }}/cache-restore
      - name: Restore durable Bazel snapshot
        if: steps.cache-identity.outcome == 'success' && steps.cache-download.outcome == 'success'
        id: cache-restore
        continue-on-error: true
        run: |
          python3 scripts/ci_cache.py restore --identity "$RUNNER_TEMP/cache-identity.json" \
            --snapshot "$RUNNER_TEMP/cache-restore" \
            --disk "$HOME/.cache/omp-bazel-disk" --repo "$HOME/.cache/omp-bazel-repo"
      - name: Report unavailable durable cache
        if: steps.cache-identity.outcome == 'failure' || steps.cache-download.outcome == 'failure' || steps.cache-restore.outcome == 'failure'
        run: echo "::warning::Bazel snapshot unavailable; required native build will run with compatible hot cache or cold inputs."
      - name: Restore compatible GitHub hot cache
        if: steps.cache-identity.outcome == 'success' && steps.pr-cache.outputs.hit != 'true' && steps.cache-restore.outputs.hit != 'true'
        id: bazel-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/omp-bazel-disk
            ~/.cache/omp-bazel-repo
          key: coreforge-bazel-v2-${{ steps.cache-identity.outputs.key }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'MODULE.bazel', 'MODULE.bazel.lock', 'rust-toolchain.toml', 'rustfmt.toml', '.bazelrc', '.bazelignore', '.bazelversion', 'bazel/**', 'crates/**', 'BUILD.bazel') }}
          restore-keys: |
            coreforge-bazel-v2-${{ steps.cache-identity.outputs.key }}-
      - name: Build native addon from Coreforge sources
        if: matrix.windows != '1'
        env:
          NATIVE_TARGETS: ${{ matrix.native_targets }}
        run: |
          set -euo pipefail
          if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
          mkdir -p "$HOME/.cache/omp-bazel-disk" "$HOME/.cache/omp-bazel-repo"
          {
            echo "build --config=ci"
            echo "common --disk_cache=$HOME/.cache/omp-bazel-disk"
            echo "common --repository_cache=$HOME/.cache/omp-bazel-repo"
          } > "$RUNNER_TEMP/coreforge-bazel.rc"
          export OMP_BAZEL_RC="$RUNNER_TEMP/coreforge-bazel.rc"
          read -r -a targets <<< "$NATIVE_TARGETS"
          bun scripts/bazel-natives.ts "${targets[@]}"
          ls packages/natives/native/*.node
      - name: Build native addon from Coreforge sources (Windows ARM64)
        if: matrix.windows == '1'
        env:
          OMP_NATIVE_CARGO_PROFILE: ci
        run: bun scripts/bazel-natives.ts host --dest packages/natives/native
      - name: Verify embedded Apple Foundation Models bridge
        if: matrix.target == 'darwin-arm64'
        run: |
          addon=packages/natives/native/pi_natives.darwin-arm64.node
          test -s "$addon"
          grep -aqF OmpAppleFm "$addon" ||
            { echo "::error::Darwin ARM64 addon lacks the embedded Apple Foundation Models bridge"; exit 1; }
          if otool -L "$addon" | grep -E 'libswift|FoundationModels'; then
            echo "::error::Darwin ARM64 addon directly links the Swift runtime or FoundationModels"; exit 1
          fi
      - name: Package source-built native addon
        if: matrix.windows != '1'
        run: |
          set -euo pipefail
          shopt -s nullglob
          native_target="${{ matrix.target }}"
          if [[ "$native_target" == linux-musl-* ]]; then native_target="${native_target/linux-musl-/linux-}"; fi
          addons=(packages/natives/native/pi_natives."${native_target}"*.node)
          expected=1
          if [ "${{ matrix.target }}" = "linux-x64" ]; then expected=2; fi
          if [ "${#addons[@]}" -ne "$expected" ]; then
            echo "expected $expected native files for ${{ matrix.target }}, found ${#addons[@]}" >&2
            printf '  %s\n' "${addons[@]}" >&2
            exit 1
          fi
          mkdir -p release-assets/package
          cp "${addons[@]}" release-assets/package/
          cp LICENSE THIRD-PARTY-NOTICES.txt release-assets/package/
          tar -czf "release-assets/coreforge-pi-natives-${{ matrix.target }}-${RELEASE_TAG}.tgz" \
            -C release-assets package
      - name: Package source-built native addon (Windows ARM64)
        if: matrix.windows == '1'
        shell: pwsh
        run: |
          $addons = @(Get-ChildItem "packages/natives/native/pi_natives.win32-arm64*.node")
          if ($addons.Count -ne 1) {
            throw "expected 1 native file for ${{ matrix.target }}, found $($addons.Count)"
          }
          New-Item -ItemType Directory -Force -Path release-assets/package | Out-Null
          Copy-Item $addons[0].FullName release-assets/package/
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.txt release-assets/package/ -ErrorAction Stop
          $archive = "release-assets/coreforge-pi-natives-${{ matrix.target }}-$env:RELEASE_TAG.tgz"
          tar -czf $archive -C release-assets package
          if (-not (Test-Path $archive) -or (Get-Item $archive).Length -eq 0) {
            throw "native archive was not created: $archive"
          }
      - name: Inject channel version
        if: matrix.windows != '1'
        run: bun scripts/set-cf-version.ts "${RELEASE_TAG#v}"
      - name: Inject channel version (Windows)
        if: matrix.windows == '1'
        shell: pwsh
        run: bun scripts/set-cf-version.ts ($env:RELEASE_TAG.Substring(1))
      - name: Build binary
        env:
          RELEASE_TARGETS: ${{ matrix.target }}
        run: bun run ci:release:build-binaries
      - name: Sign and notarize macOS binary (Developer ID)
        # Replaces the ad-hoc signature with a hardened-runtime Developer ID
        # signature and notarizes it. Releases remain ad-hoc until every
        # APPLE_* secret is configured.
        if: startsWith(matrix.target, 'darwin-') && env.MACOS_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: bash scripts/ci-macos-sign.sh "packages/coding-agent/binaries/${{ matrix.binary }}"
      - name: Verify macOS release signature
        if: startsWith(matrix.target, 'darwin-')
        run: |
          binary="packages/coding-agent/binaries/${{ matrix.binary }}"
          codesign --verify --strict --verbose=4 "$binary"
          if [[ "$MACOS_SIGNING" == 'true' ]]; then
            info="$(codesign -dvvv "$binary" 2>&1)"
            printf '%s\n' "$info"
            if grep -qE 'flags=.*adhoc|Signature=adhoc' <<< "$info"; then
              echo "::error::$binary is ad-hoc signed despite configured Developer ID credentials"
              exit 1
            fi
          fi
      - name: Smoke binary
        # Cross-built win32 has no runner to execute on (matches upstream);
        # native builds must report the injected channel version. The `--version`
        # output is `<brand>/<version>` (brand = CF_COMMAND, `coreforge` by
        # default, overridable for white-label), so assert the VERSION suffix
        # rather than a hard-coded `omp/` prefix -- the stamped version is what
        # this step exists to verify.
        if: matrix.windows != '1' && matrix.cross != '1'
        run: |
          OUT="$(./packages/coding-agent/binaries/${{ matrix.binary }} --version)"
          echo "reported: $OUT"
          VERSION="${RELEASE_TAG#v}"
          case "$OUT" in
            */"$VERSION") echo "version OK: $OUT" ;;
            *) echo "::error::expected */$VERSION, got $OUT"; exit 1 ;;
          esac
      - name: Smoke binary (Windows ARM64)
        if: matrix.windows == '1'
        shell: pwsh
        run: |
          $binaryPath = (Resolve-Path "packages/coding-agent/binaries/${{ matrix.binary }}").Path
          $out = (& $binaryPath --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "reported: $out"
          $version = $env:RELEASE_TAG.Substring(1)
          if (-not $out.EndsWith("/$version")) {
            throw "expected */$version, got $out"
          }
          & $binaryPath --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: packages/coding-agent/binaries/${{ matrix.binary }}
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: release-assets/coreforge-pi-natives-${{ matrix.target }}-${{ env.RELEASE_TAG }}.tgz
          if-no-files-found: error
          overwrite: true
      - name: Save successful GitHub hot cache
        if: success() && matrix.windows != '1' && steps.cache-identity.outcome == 'success' && steps.bazel-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/omp-bazel-disk
            ~/.cache/omp-bazel-repo
          key: coreforge-bazel-v2-${{ steps.cache-identity.outputs.key }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'MODULE.bazel', 'MODULE.bazel.lock', 'rust-toolchain.toml', 'rustfmt.toml', '.bazelrc', '.bazelignore', '.bazelversion', 'bazel/**', 'crates/**', 'BUILD.bazel') }}
      - name: Prepare successful durable cache candidate
        if: success() && matrix.windows != '1' && vars.CI_CACHE_ENABLED == 'true' && steps.cache-identity.outcome == 'success'
        id: cache-pack
        continue-on-error: true
        run: |
          BAZEL="$(command -v bazelisk || command -v bazel)"
          "$BAZEL" --bazelrc="$RUNNER_TEMP/coreforge-bazel.rc" shutdown
          python3 scripts/ci_cache.py pack --identity "$RUNNER_TEMP/cache-identity.json" \
            --disk "$HOME/.cache/omp-bazel-disk" --repo "$HOME/.cache/omp-bazel-repo" \
            --output "$RUNNER_TEMP/cache-snapshot"
      - name: Retain durable cache candidate for successful-release publication
        if: success() && steps.cache-pack.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-${{ matrix.target }}-${{ matrix.os }}
          path: ${{ runner.temp }}/cache-snapshot
          retention-days: 1
          if-no-files-found: error

  release_smoke:
    name: smoke release (${{ matrix.target }})
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.should_release == 'true' && needs.build.result == 'success' }}
    concurrency:
      group: cf-release-smoke-${{ matrix.target }}-${{ github.ref_type == 'branch' && github.run_attempt == 1 && 'latest' || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: xcode-27 }
          - { target: darwin-x64, os: macos-15-intel }
          - { target: linux-x64, os: ubuntu-22.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: linux-musl-x64, os: ubuntu-22.04 }
          - { target: linux-musl-arm64, os: ubuntu-24.04-arm }
          - { target: win32-x64, os: windows-2025 }
          - { target: win32-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.release_sha }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-${{ matrix.target }}
          path: release-smoke-assets
      - name: Verify downloaded macOS signature
        if: startsWith(matrix.target, 'darwin-')
        run: codesign --verify --strict --verbose=4 release-smoke-assets/omp-${{ matrix.target }}
      - name: Exercise final release binary
        run: bun --no-env-file scripts/ci-release-smoke.ts smoke "${{ matrix.target }}" release-smoke-assets release-smoke-receipts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-smoke-${{ matrix.target }}
          path: release-smoke-receipts/*.json
          if-no-files-found: error
          overwrite: true

  cache_publish:
    needs: [prepare, build, release, verify_release]
    if: ${{ !cancelled() && vars.CI_CACHE_ENABLED == 'true' && needs.prepare.result == 'success' && needs.build.result == 'success' && needs.release.result == 'success' && needs.verify_release.result == 'success' }}
    uses: Coreforce-CAD/oh-my-pi/.github/workflows/cf-cache-write.yml@c4d074b6ef60c229874d0fda96740cd71877f94c
    with:
      enabled: true
      source-sha: ${{ needs.prepare.outputs.release_sha }}
      expected-workflow: cf-release
      build-result: ${{ needs.build.result }}
    permissions:
      contents: read
      actions: read
      id-token: write

  release:
    permissions:
      contents: write
    needs: [prepare, build, release_smoke]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.should_release == 'true' && needs.build.result == 'success' && needs.release_smoke.result == 'success' }}
    concurrency:
      group: cf-release-publish
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.release_sha }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Fetch upstream release base
        env:
          OMP_UPSTREAM_REPO: can1357/oh-my-pi
        run: |
          UPSTREAM_TAG="${RELEASE_TAG%.*}"
          git fetch --no-tags "https://github.com/${OMP_UPSTREAM_REPO}.git" \
            "refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-smoke-*
          path: ${{ runner.temp }}/release-smoke-receipts
          merge-multiple: true
      - name: Bind publication to smoke-tested bytes
        run: bun --no-env-file scripts/ci-release-smoke.ts verify release-assets "$RUNNER_TEMP/release-smoke-receipts" release-assets/release-verification.json
      - name: Build Coreforge Browser Relay extension
        run: |
          bun --cwd=packages/browser-relay run build
          cp packages/browser-relay/dist/coreforge-browser-relay-extension.zip release-assets/
      - name: Generate release checksums
        run: |
          bun scripts/ci-release-checksums.ts release-assets/SHA256SUMS.txt \
            release-assets/omp-* \
            release-assets/coreforge-pi-natives-*.tgz \
            release-assets/coreforge-browser-relay-extension.zip \
            release-assets/release-verification.json
      - name: Generate release notes
        # Floor at the latest published release so canceled candidates remain in the combined notes.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/cf-release-notes.ts "$RELEASE_TAG" release-notes.md
      - name: Create immutable release tag
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch origin +coreforge:refs/remotes/origin/coreforge --quiet
          TIP="$(git rev-parse refs/remotes/origin/coreforge)"
          if [ "$RELEASE_SHA" != "$TIP" ]; then
            echo "coreforge advanced from $RELEASE_SHA to $TIP before publication - refusing to tag"
            exit 1
          fi
          if git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" --force --quiet
            TAG_COMMIT="$(git rev-parse "$RELEASE_TAG^{commit}")"
            if [ "$TAG_COMMIT" != "$RELEASE_SHA" ]; then
              echo "release tag $RELEASE_TAG already points at $TAG_COMMIT, expected $RELEASE_SHA"
              exit 1
            fi
            echo "release tag $RELEASE_TAG already identifies $RELEASE_SHA - resuming"
          else
            git push origin "$RELEASE_SHA:refs/tags/$RELEASE_TAG"
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "coreforge engine $RELEASE_TAG" \
            --notes-file release-notes.md

  verify_release:
    needs: [prepare, release]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.should_release == 'true' && needs.release.result == 'success' }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY != '' }}
    runs-on: xcode-27
    permissions:
      contents: read
    steps:
      - name: Download published macOS arm64 binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "omp-darwin-arm64"
          chmod +x omp-darwin-arm64
      - name: Download published source-install native addon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "coreforge-pi-natives-darwin-arm64-${RELEASE_TAG}.tgz"
      - name: Verify published checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "SHA256SUMS.txt"
          awk -v binary="omp-darwin-arm64" \
              -v native="coreforge-pi-natives-darwin-arm64-${RELEASE_TAG}.tgz" '
            $2 == binary || $2 == native { count[$2]++; print }
            END {
              if (count[binary] != 1 || count[native] != 1) {
                print "missing or duplicate release checksum" > "/dev/stderr"
                exit 1
              }
            }
          ' SHA256SUMS.txt > SHA256SUMS.verify
          shasum -a 256 -c SHA256SUMS.verify
      - name: Verify published source-install native addon
        run: |
          tar -xzf "coreforge-pi-natives-darwin-arm64-${RELEASE_TAG}.tgz"
          test -f package/pi_natives.darwin-arm64.node
          node -e 'require("./package/pi_natives.darwin-arm64.node")'
      - name: Verify published macOS arm64 binary
        run: |
          codesign -dvvv ./omp-darwin-arm64
          codesign --verify --strict --verbose=4 ./omp-darwin-arm64
          runtime_dir="$(mktemp -d)"
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" ./omp-darwin-arm64 --version
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" ./omp-darwin-arm64 --smoke-test
      - name: Assert signed release is not ad-hoc
        if: env.MACOS_SIGNING == 'true'
        run: |
          if codesign -dvvv ./omp-darwin-arm64 2>&1 | grep -qE "flags=.*adhoc|Signature=adhoc"; then
            echo "published binary is still ad-hoc signed" >&2
            exit 1
          fi
          spctl -a -t exec -vv ./omp-darwin-arm64 || \
            echo "spctl non-zero (expected for an unstapled binary; ticket is served online)"
