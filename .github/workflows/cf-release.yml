# Coreforge engine release - builds omp binaries from the patched coreforge
# branch and publishes them as GitHub Releases on this private mirror.
# Employees' `omp update` (patched to the cf channel, see
# packages/coding-agent/src/cli/cf-channel.ts) pulls from these releases.
# Coreforge appliances install the exact release selected by `engine.lock`.
#
# Trigger: a coreforge branch update associated with a merged pull request
# allocates the next `v<upstream>.<roll>` tag and publishes that exact commit.
# Direct branch updates do not publish; a manually pushed four-segment tag
# remains the recovery path. The first three segments MUST match
# packages/coding-agent/package.json; the fourth is the Coreforge patch roll.
# Engine releases are channel-neutral dependency artifacts. Coreforge's
# independent beta-first product release and stable promotion gates decide
# which exact engine.lock pin employees receive.
#
# Build reuses upstream's release tooling (`bun run ci:release:build-binaries`
# = scripts/ci-release-build-binaries.ts): per-target native embed, correct
# bun target names, initial Darwin ad-hoc signing, and asset names matching
# `getBinaryName()` in `update-cli.ts`. When every `APPLE_*` secret exists, the
# workflow replaces Darwin signatures with notarized Developer ID signatures.
# Darwin builds run natively on macOS; win32 is cross-built on Linux exactly
# like upstream.
# Native addons are built from this fork's source for every target. This keeps
# release binaries aligned with Coreforge native adaptations instead of
# silently substituting upstream npm prebuilts.
#
# This file lives only on the coreforge branch (never on main, which mirrors
# upstream), so upstream syncs merge it forward like any other fork change.
name: cf-release

on:
  push:
    branches:
      - coreforge
    tags:
      - "v*.*.*.*"

permissions:
  pull-requests: read
  contents: write

concurrency:
  group: cf-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      should_release: ${{ steps.release.outputs.should_release }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: "1.3"
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          git fetch origin +coreforge:refs/remotes/origin/coreforge --tags --force --quiet
          TIP="$(git rev-parse refs/remotes/origin/coreforge)"
          PKG="$(bun -e 'console.log(JSON.parse(await Bun.file("packages/coding-agent/package.json").text()).version)')"

          if [ "$EVENT_REF_TYPE" = "tag" ]; then
            TAG="$EVENT_REF_NAME"
            RELEASE_SHA="$(git rev-parse "$TAG^{commit}")"
            if [ "$RELEASE_SHA" != "$TIP" ]; then
              echo "tag commit $RELEASE_SHA is not the coreforge tip ($TIP) - refusing to release"
              exit 1
            fi
          else
            MERGED_PR_COUNT="$(
              gh api "repos/${GITHUB_REPOSITORY}/commits/${EVENT_SHA}/pulls" \
                --jq '[.[] | select(.merged_at != null and .base.ref == "coreforge")] | length'
            )"
            if [ "$MERGED_PR_COUNT" -eq 0 ]; then
              echo "$EVENT_SHA was not introduced by a merged coreforge pull request - manual release required"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$EVENT_SHA" != "$TIP" ]; then
              echo "coreforge advanced from $EVENT_SHA to $TIP - a newer run will publish the tip"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            LAST=0
            RESUME_TAG=""
            while IFS= read -r candidate; do
              roll="${candidate#v"${PKG}".}"
              case "$candidate" in
                "v${PKG}."[1-9]*) ;;
                *) continue ;;
              esac
              case "$roll" in
                *[!0-9]*) continue ;;
              esac
              if [ "$roll" -gt "$LAST" ]; then LAST="$roll"; fi

              candidate_commit="$(git rev-parse "$candidate^{commit}")"
              if [ "$candidate_commit" = "$EVENT_SHA" ] &&
                 ! gh release view "$candidate" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                if [ -n "$RESUME_TAG" ]; then
                  echo "multiple unpublished release tags point at $EVENT_SHA: $RESUME_TAG and $candidate"
                  exit 1
                fi
                RESUME_TAG="$candidate"
              fi
            done < <(git tag --list "v${PKG}.*")

            if [ -n "$RESUME_TAG" ]; then
              TAG="$RESUME_TAG"
              echo "resuming unpublished release tag $TAG"
            else
              TAG="v${PKG}.$((LAST + 1))"
            fi
            RELEASE_SHA="$EVENT_SHA"
          fi

          ROLL="${TAG#v"${PKG}".}"
          case "$TAG" in
            "v${PKG}."[1-9]*) ;;
            *) echo "tag $TAG does not extend package version $PKG"; exit 1 ;;
          esac
          case "$ROLL" in
            *[!0-9]*) echo "tag $TAG has a non-numeric roll"; exit 1 ;;
          esac
          echo "release tag: $TAG"
          {
            echo "release_tag=$TAG"
            echo "should_release=true"
            echo "release_sha=$RELEASE_SHA"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY != '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-14
            binary: omp-darwin-arm64
            native_targets: darwin-arm64
          - target: darwin-x64
            os: macos-15-intel
            binary: omp-darwin-x64
            native_targets: darwin-x64-baseline
          - target: linux-x64
            os: ubuntu-22.04
            binary: omp-linux-x64
            native_targets: "linux-x64-baseline linux-x64-modern"
          - target: linux-arm64
            os: ubuntu-24.04-arm
            binary: omp-linux-arm64
            native_targets: linux-arm64
          - target: win32-x64
            os: ubuntu-24.04
            cross: "1"
            binary: omp-windows-x64.exe
            native_targets: win32-x64-baseline
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_sha }}
      - name: Guard release commit is the coreforge branch tip
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          git fetch origin +coreforge:refs/remotes/origin/coreforge --quiet
          HEAD_COMMIT="$(git rev-parse HEAD)"
          TIP="$(git rev-parse refs/remotes/origin/coreforge)"
          if [ "$HEAD_COMMIT" != "$RELEASE_SHA" ]; then
            echo "checkout $HEAD_COMMIT does not match prepared commit $RELEASE_SHA"
            exit 1
          fi
          if [ "$RELEASE_SHA" != "$TIP" ]; then
            echo "prepared commit $RELEASE_SHA is not the coreforge tip ($TIP) - refusing to release"
            exit 1
          fi
          echo "release commit $RELEASE_SHA is the coreforge tip - ok"
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: "1.3"
      - name: Guard tag against package version
        run: |
          TAG="${RELEASE_TAG#v}"
          PKG="$(bun -e 'console.log(JSON.parse(await Bun.file("packages/coding-agent/package.json").text()).version)')"
          case "$TAG" in
            "$PKG".*) echo "tag $TAG rolls upstream $PKG - ok" ;;
            *) echo "tag $TAG does not extend package version $PKG"; exit 1 ;;
          esac
      - name: Reclaim disk for Windows native cross-build
        if: matrix.target == 'win32-x64'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /
      - run: bun install --frozen-lockfile
      - name: Cache Bazel native builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/omp-bazel-disk
            ~/.cache/omp-bazel-repo
          key: coreforge-bazel-v1-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'MODULE.bazel', 'MODULE.bazel.lock', 'rust-toolchain.toml', 'rustfmt.toml', '.bazelrc', '.bazelignore', '.bazelversion', 'bazel/**', 'crates/**', 'BUILD.bazel') }}
          restore-keys: |
            coreforge-bazel-v1-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Build native addon from Coreforge sources
        env:
          NATIVE_TARGETS: ${{ matrix.native_targets }}
        run: |
          set -euo pipefail
          if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
          mkdir -p "$HOME/.cache/omp-bazel-disk" "$HOME/.cache/omp-bazel-repo"
          {
            echo "common --config=ci"
            echo "common --disk_cache=$HOME/.cache/omp-bazel-disk"
            echo "common --repository_cache=$HOME/.cache/omp-bazel-repo"
          } > "$RUNNER_TEMP/coreforge-bazel.rc"
          export OMP_BAZEL_RC="$RUNNER_TEMP/coreforge-bazel.rc"
          read -r -a targets <<< "$NATIVE_TARGETS"
          bun scripts/bazel-natives.ts "${targets[@]}"
          ls packages/natives/native/*.node
      - name: Package source-built native addon
        run: |
          set -euo pipefail
          shopt -s nullglob
          addons=(packages/natives/native/pi_natives."${{ matrix.target }}"*.node)
          expected=1
          if [ "${{ matrix.target }}" = "linux-x64" ]; then expected=2; fi
          if [ "${#addons[@]}" -ne "$expected" ]; then
            echo "expected $expected native files for ${{ matrix.target }}, found ${#addons[@]}" >&2
            printf '  %s\n' "${addons[@]}" >&2
            exit 1
          fi
          mkdir -p release-assets/package
          cp "${addons[@]}" release-assets/package/
          tar -czf "release-assets/coreforge-pi-natives-${{ matrix.target }}-${RELEASE_TAG}.tgz" \
            -C release-assets package
      - name: Inject channel version
        run: bun scripts/set-cf-version.ts "${RELEASE_TAG#v}"
      - name: Build binary
        env:
          RELEASE_TARGETS: ${{ matrix.target }}
        run: bun run ci:release:build-binaries
      - name: Sign and notarize macOS binary (Developer ID)
        # Replaces the ad-hoc signature with a hardened-runtime Developer ID
        # signature and notarizes it. Releases remain ad-hoc until every
        # APPLE_* secret is configured.
        if: startsWith(matrix.target, 'darwin-') && env.MACOS_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: bash scripts/ci-macos-sign.sh "packages/coding-agent/binaries/${{ matrix.binary }}"
      - name: Smoke binary
        # Cross-built win32 has no runner to execute on (matches upstream);
        # native builds must report the injected channel version. The `--version`
        # output is `<brand>/<version>` (brand = CF_COMMAND, `coreforge` by
        # default, overridable for white-label), so assert the VERSION suffix
        # rather than a hard-coded `omp/` prefix -- the stamped version is what
        # this step exists to verify.
        if: matrix.cross != '1'
        run: |
          OUT="$(./packages/coding-agent/binaries/${{ matrix.binary }} --version)"
          echo "reported: $OUT"
          VERSION="${RELEASE_TAG#v}"
          case "$OUT" in
            */"$VERSION") echo "version OK: $OUT" ;;
            *) echo "::error::expected */$VERSION, got $OUT"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.target }}
          path: packages/coding-agent/binaries/${{ matrix.binary }}
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: release-assets/coreforge-pi-natives-${{ matrix.target }}-${{ env.RELEASE_TAG }}.tgz
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: "1.3"
      - name: Fetch upstream release base
        env:
          OMP_UPSTREAM_REPO: can1357/oh-my-pi
        run: |
          UPSTREAM_TAG="${RELEASE_TAG%.*}"
          git fetch --no-tags "https://github.com/${OMP_UPSTREAM_REPO}.git" \
            "refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true
      - name: Build Coreforge Browser Relay extension
        run: |
          bun --cwd=packages/browser-relay run build
          cp packages/browser-relay/dist/coreforge-browser-relay-extension.zip release-assets/
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/cf-release-notes.ts "$RELEASE_TAG" release-notes.md
      - name: Create immutable release tag
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch origin +coreforge:refs/remotes/origin/coreforge --quiet
          TIP="$(git rev-parse refs/remotes/origin/coreforge)"
          if [ "$RELEASE_SHA" != "$TIP" ]; then
            echo "coreforge advanced from $RELEASE_SHA to $TIP before publication - refusing to tag"
            exit 1
          fi
          if git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" --force --quiet
            TAG_COMMIT="$(git rev-parse "$RELEASE_TAG^{commit}")"
            if [ "$TAG_COMMIT" != "$RELEASE_SHA" ]; then
              echo "release tag $RELEASE_TAG already points at $TAG_COMMIT, expected $RELEASE_SHA"
              exit 1
            fi
            echo "release tag $RELEASE_TAG already identifies $RELEASE_SHA - resuming"
          else
            git push origin "$RELEASE_SHA:refs/tags/$RELEASE_TAG"
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "coreforge engine $RELEASE_TAG" \
            --notes-file release-notes.md

  verify_release:
    needs: [prepare, release]
    if: needs.prepare.outputs.should_release == 'true'
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY != '' }}
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Download published macOS arm64 binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "omp-darwin-arm64"
          chmod +x omp-darwin-arm64
      - name: Verify published source-install native addon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "coreforge-pi-natives-darwin-arm64-${RELEASE_TAG}.tgz"
          tar -xzf "coreforge-pi-natives-darwin-arm64-${RELEASE_TAG}.tgz"
          test -f package/pi_natives.darwin-arm64.node
          node -e 'require("./package/pi_natives.darwin-arm64.node")'
      - name: Verify published macOS arm64 binary
        run: |
          codesign -dvvv ./omp-darwin-arm64
          codesign --verify --strict --verbose=4 ./omp-darwin-arm64
          runtime_dir="$(mktemp -d)"
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" ./omp-darwin-arm64 --version
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" ./omp-darwin-arm64 --smoke-test
      - name: Assert signed release is not ad-hoc
        if: env.MACOS_SIGNING == 'true'
        run: |
          if codesign -dvvv ./omp-darwin-arm64 2>&1 | grep -qE "flags=.*adhoc|Signature=adhoc"; then
            echo "published binary is still ad-hoc signed" >&2
            exit 1
          fi
          spctl -a -t exec -vv ./omp-darwin-arm64 || \
            echo "spctl non-zero (expected for an unstapled binary; ticket is served online)"
