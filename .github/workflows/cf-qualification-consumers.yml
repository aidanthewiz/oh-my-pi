name: cf-qualification-consumers

on:
  workflow_call:
    inputs:
      source-sha:
        description: Exact same-repository pull-request head that produced the native and executable artifacts
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  consumers:
    name: qualification ${{ matrix.scope }} ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        scope: [domains, controls, sdk]
        mode: [source, compiled]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: qualification-root
          MYSQL_DATABASE: qualification
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=qualification-root"
          --health-interval=10s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qualification
          POSTGRES_PASSWORD: qualification-postgres
          POSTGRES_DB: qualification
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd="pg_isready -U qualification -d qualification"
          --health-interval=10s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualification-inputs-linux-x64
          path: .
      - name: Verify exact producer inputs
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: bun scripts/ci-qualification-engine.ts verify-inputs linux-x64 "$SOURCE_SHA"
      - name: Install isolated fixture tools
        run: |
          bash scripts/ci-install-ubuntu-packages.sh bubblewrap python3-venv procps fonts-dejavu-core
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version
          python3 --version
          go version
          rustc --version
          cargo --version
      - name: Execute real consumer fixtures
        env:
          CF_QUAL_SOURCE_SHA: ${{ inputs.source-sha }}
          CF_QUAL_OUTPUT: ${{ runner.temp }}/qualification-output
          CF_QUAL_CHROMIUM: /usr/bin/google-chrome
          CF_QUAL_MYSQL_URL: mysql://root:qualification-root@127.0.0.1:3306/qualification
          CF_QUAL_POSTGRES_URL: postgres://qualification:qualification-postgres@127.0.0.1:5432/qualification
          CF_QUAL_REDIS_URL: redis://127.0.0.1:6379
          QUAL_SCOPE: ${{ matrix.scope }}
          QUAL_MODE: ${{ matrix.mode }}
        run: |
          export CF_QUAL_TOOL_PATH="$PATH"
          bun --no-env-file scripts/qualification/run.ts "$QUAL_SCOPE" "$QUAL_MODE"
      - name: Stop synthetic database services
        if: always()
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/qualification-output"
          docker inspect "$MYSQL_CONTAINER" "$POSTGRES_CONTAINER" "$REDIS_CONTAINER" > "$RUNNER_TEMP/qualification-output/service-before-teardown.json"
          docker stop --time 15 "$MYSQL_CONTAINER" "$POSTGRES_CONTAINER" "$REDIS_CONTAINER"
          docker inspect "$MYSQL_CONTAINER" "$POSTGRES_CONTAINER" "$REDIS_CONTAINER" > "$RUNNER_TEMP/qualification-output/service-after-teardown.json"
          test "$(docker inspect --format '{{.State.Running}}' "$MYSQL_CONTAINER")" = false
          test "$(docker inspect --format '{{.State.Running}}' "$POSTGRES_CONTAINER")" = false
          test "$(docker inspect --format '{{.State.Running}}' "$REDIS_CONTAINER")" = false
      - name: Retain observed results and visual inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-runtime-${{ matrix.scope }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/qualification-output
          if-no-files-found: error
          retention-days: 3

  visual:
    name: qualification raster evidence (inspection required)
    needs: consumers
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualification-inputs-linux-x64
          path: .
      - name: Verify exact producer inputs
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: bun scripts/ci-qualification-engine.ts verify-inputs linux-x64 "$SOURCE_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualification-runtime-domains-source
          path: ${{ runner.temp }}/domain-inputs/source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualification-runtime-domains-compiled
          path: ${{ runner.temp }}/domain-inputs/compiled
      - name: Install raster fonts
        run: bash scripts/ci-install-ubuntu-packages.sh fonts-dejavu-core
      - name: Produce current and peer raster evidence
        env:
          CF_QUAL_SOURCE_SHA: ${{ inputs.source-sha }}
          CF_QUAL_OUTPUT: ${{ runner.temp }}/qualification-visual
          CF_QUAL_DOMAIN_OUTPUT_ROOT: ${{ runner.temp }}/domain-inputs
        run: |
          export CF_QUAL_TOOL_PATH="$PATH"
          status=0
          bun --no-env-file scripts/qualification/run.ts visual source || status=1
          bun --no-env-file scripts/qualification/run.ts visual compiled || status=1
          exit "$status"
      - name: Enforce original forty-raster and peer contract
        if: always()
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: bun --no-env-file scripts/qualification/visual/gate.ts "$RUNNER_TEMP/qualification-visual" "$SOURCE_SHA"
      - name: Retain raster inspection index
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-visual-inspection-required
          path: ${{ runner.temp }}/qualification-visual
          if-no-files-found: error
          retention-days: 3
