name: cf-verify-engine

on:
  workflow_call:
    inputs:
      source-sha:
        type: string
        required: true
      target:
        type: string
        required: true
      qualification-runner:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  qualification_engine:
    name: ${{ matrix.label }}
    runs-on: ${{ inputs.qualification-runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: typescript-tests
            shard: 1/3
            receipt: typescript-tests-1-of-3
            label: TypeScript - shard 1 of 3
          - scope: typescript-tests
            shard: 2/3
            receipt: typescript-tests-2-of-3
            label: TypeScript - shard 2 of 3
          - scope: typescript-tests
            shard: 3/3
            receipt: typescript-tests-3-of-3
            label: TypeScript - shard 3 of 3
          - scope: typescript-smoke
            receipt: typescript-smoke
            label: TypeScript - smoke
          - scope: rust
            receipt: rust
            label: Rust - workspace
    env:
      SOURCE_SHA: ${{ inputs.source-sha }}
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: "false"
      CARGO_PROFILE_TEST_STRIP: "false"
      CARGO_PROFILE_CI_STRIP: "false"
      CARGO_PROFILE_RELEASE_STRIP: "false"
      OMP_TEST_CONCURRENCY: "2"
      OMP_NO_ENV_FILE: "1"
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      NO_COLOR: "1"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Prepare private qualification environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qualification-home" "$RUNNER_TEMP/qualification-tmp" "$RUNNER_TEMP/qualification-engine-${{ matrix.receipt }}"
          chmod 700 "$RUNNER_TEMP/qualification-home" "$RUNNER_TEMP/qualification-tmp"
          {
            echo "HOME=$RUNNER_TEMP/qualification-home"
            echo "TMPDIR=$RUNNER_TEMP/qualification-tmp"
            echo "TMP=$RUNNER_TEMP/qualification-tmp"
            echo "TEMP=$RUNNER_TEMP/qualification-tmp"
            echo "QUALIFICATION_RECEIPT_DIR=$RUNNER_TEMP/qualification-engine-${{ matrix.receipt }}"
            echo "CARGO_HOME=$RUNNER_TEMP/qualification-cargo"
            echo "RUSTUP_HOME=$RUNNER_TEMP/qualification-rustup"
          } >> "$GITHUB_ENV"
      - name: Reclaim unused hosted tools for complete Rust qualification
        if: runner.os == 'Linux' && matrix.scope == 'rust'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Restore Cargo qualification cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/qualification-cargo
            ${{ runner.temp }}/qualification-rustup
            target
          key: qualification-cargo-v1-${{ inputs.target }}-${{ matrix.scope == 'rust' && 'rust' || 'typescript' }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: |
            qualification-cargo-v1-${{ inputs.target }}-${{ matrix.scope == 'rust' && 'rust' || 'typescript' }}-
      - name: Install pinned qualification tools
        shell: bash
        run: |
          set -euo pipefail
          channel="$(bun -e 'console.log(Bun.TOML.parse(await Bun.file("rust-toolchain.toml").text()).toolchain.channel)')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy --no-self-update
          toolchain_bin="$(dirname "$(rustup which --toolchain "$channel" cargo)")"
          echo "$toolchain_bin" >> "$GITHUB_PATH"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          echo "RUSTUP_AUTO_INSTALL=0" >> "$GITHUB_ENV"
      - name: Install Rust suite runner
        if: matrix.scope == 'rust'
        run: |
          if ! cargo nextest --version | grep -F '0.9.114'; then
            cargo install cargo-nextest --version 0.9.114 --locked
          fi
      - name: Install pinned attribution tool
        if: matrix.scope == 'rust' && runner.os == 'Linux'
        run: |
          if ! cargo about --version | grep -F 'cargo-about 0.8.2'; then
            cargo install cargo-about --version 0.8.2 --locked
          fi
      - name: Install Linux qualification dependencies
        if: runner.os == 'Linux'
        env:
          QUAL_SCOPE: ${{ matrix.scope }}
        run: |
          bash scripts/ci-install-ubuntu-packages.sh ninja-build pkg-config cmake libclang-dev libasound2-dev libudev-dev libssl-dev python3 redis-server bubblewrap lsof
          if [[ "$QUAL_SCOPE" == typescript-* ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install Darwin qualification dependencies
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config cmake redis
      - name: Install exact locked dependencies
        run: |
          bun install --frozen-lockfile
          bun install --cwd .omp/tools --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualification-inputs-${{ inputs.target }}
          path: .
      - name: Run complete engine scope
        run: |
          if [ "${{ matrix.scope }}" = typescript-tests ]; then
            export OMP_TEST_SHARD="${{ matrix.shard }}"
          else
            unset OMP_TEST_SHARD
          fi
          bun scripts/ci-qualification-engine.ts "${{ matrix.scope }}"
      - name: Retain engine qualification receipts and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-engine-${{ inputs.target }}-${{ matrix.receipt }}
          retention-days: 3
          if-no-files-found: error
          overwrite: true
          path: ${{ runner.temp }}/qualification-engine-${{ matrix.receipt }}
      - name: Save compatible Cargo qualification cache
        if: success() && matrix.scope != 'typescript-tests' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/qualification-cargo
            ${{ runner.temp }}/qualification-rustup
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
