name: cf-cache-write

on:
  workflow_call:
    inputs:
      enabled:
        description: Owner-controlled cache enablement
        default: false
        type: boolean
      source-sha:
        description: Exact protected build source commit
        required: true
        type: string
      expected-workflow:
        description: cf-release, relay, or protected cf-cache-canary
        required: true
        type: string
      build-result:
        description: Caller needs result; API-verified predecessors remain authoritative
        required: true
        type: string
      canary-id:
        description: Protected dispatch namespace; empty for production
        default: ""
        type: string

permissions: {}

jobs:
  publish:
    if: >-
      github.repository == 'Coreforce-CAD/oh-my-pi' &&
      ((inputs.enabled && vars.CI_CACHE_ENABLED == 'true' && github.event_name == 'push' &&
      (github.ref == 'refs/heads/coreforge' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/relay/v'))) ||
      (inputs.canary-id != '' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/coreforge'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: ${{ inputs.canary-id == '' }}
    concurrency:
      group: cf-durable-cache-publish
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CI_CACHE_BUCKET: ${{ vars.CI_CACHE_BUCKET }}
      CI_CACHE_REGION: ${{ vars.CI_CACHE_REGION }}
      CI_CACHE_PREFIX: ${{ vars.CI_CACHE_PREFIX }}
      CI_CACHE_CANARY_ID: ${{ inputs.canary-id }}
      CANARY_ID: ${{ inputs.canary-id }}
      REQUESTED: ${{ inputs.enabled }}
      ENABLED: ${{ vars.CI_CACHE_ENABLED }}
      SOURCE_SHA: ${{ inputs.source-sha }}
      EXPECTED_WORKFLOW: ${{ inputs.expected-workflow }}
      BUILD_RESULT: ${{ inputs.build-result }}
      WRITE_ROLE: ${{ vars.CI_CACHE_WRITE_ROLE }}
      CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
      CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
      AWS_ENDPOINT_URL: ""
      AWS_ENDPOINT_URL_S3: ""
      AWS_IGNORE_CONFIGURED_ENDPOINT_URLS: "true"
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
    steps:
      - name: Checkout protected helper only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Coreforce-CAD/oh-my-pi
          ref: coreforge
          persist-credentials: false

      - name: Verify authoritative source and completed predecessors before OIDC
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_cache_guard.py authorize-write

      - name: Download inert snapshots from this run only
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: snapshot-*
          path: ${{ runner.temp }}/cache-publish
          merge-multiple: false

      - name: Validate same-attempt snapshot provenance before OIDC
        run: python3 scripts/ci_cache_guard.py snapshots

      - name: Recheck current protected tip immediately before OIDC
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_cache_guard.py recheck

      - name: Record allowlisted actual OIDC claims
        run: python3 scripts/ci_cache_guard.py oidc --broker write

      - name: Assume cache write and controlled-prune role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.CI_CACHE_WRITE_ROLE }}
          aws-region: ${{ vars.CI_CACHE_REGION }}
          role-session-name: cache-write-${{ github.run_id }}-${{ github.run_attempt }}
          translate-env-variables: false
          output-env-credentials: true
          unset-current-credentials: true

      - name: Verify and record actual STS caller
        run: python3 scripts/ci_cache_guard.py identity --broker write

      - name: Publish verified snapshots and prune unreferenced generations
        env:
          CACHE_BUILD_RESULT: success
          CI_CACHE_PREFIX: ${{ steps.guard.outputs.prefix }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          slots = json.loads((Path(os.environ['RUNNER_TEMP']) / 'cache-expected-slots.json').read_text())
          for slot in slots:
              snapshot = Path(os.environ['RUNNER_TEMP']) / 'cache-publish' / ('snapshot-' + slot)
              subprocess.run(['python3', 'scripts/ci_cache.py', 'publish', '--snapshot', str(snapshot)], check=True)
          subprocess.run(['python3', 'scripts/ci_cache.py', 'prune', '--keep', '2', '--apply'], check=True)
          PY

      - name: Transfer nonsecret broker receipts
        if: always() && steps.guard.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-write-receipts${{ inputs.canary-id != '' && format('-canary-{0}', inputs.canary-id) || '' }}
          path: ${{ runner.temp }}/cache-receipts/
          if-no-files-found: warn
          retention-days: 1

      - name: Report cache-only outcome
        if: always()
        env:
          CACHE_JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$CACHE_JOB_STATUS" != success ]; then
            echo '::warning::Durable S3 cache publication failed or was refused. Original build, release, verification, and relay gates remain authoritative.'
          fi
          printf 'Durable S3 cache publication: **%s**. This is not a release or verification result.\n' "$CACHE_JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
