# Non-publishing release dry run for changes targeting the Coreforge engine.
# This workflow is separate from cf-release.yml so pull request code never runs
# in a job that can receive contents: write.
name: cf-verify

on:
  pull_request:
    branches:
      - coreforge

permissions:
  contents: read

concurrency:
  group: cf-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: classify native inputs
    runs-on: ubuntu-24.04
    outputs:
      native_changed: ${{ steps.native.outputs.changed }}
      release_tag: ${{ steps.native.outputs.tag }}
    steps:
      - name: List Coreforce releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 200 \
            --exclude-drafts \
            --json tagName,isDraft \
            > "$RUNNER_TEMP/coreforce-releases.json"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: "1.4.0"
      - name: Select native verification source
        id: native
        env:
          RELEASE_LIST: ${{ runner.temp }}/coreforce-releases.json
        run: |
          set -euo pipefail
          PKG_VERSION="$(bun -e 'console.log(JSON.parse(await Bun.file("packages/coding-agent/package.json").text()).version)')"
          RELEASE_TAG="$(bun scripts/ci-released-native.ts resolve-optional "$PKG_VERSION" "$RELEASE_LIST")"
          VERIFY_SHA="$(git rev-parse HEAD)"
          CHANGED=true
          if [ -n "$RELEASE_TAG" ] && git merge-base --is-ancestor "${RELEASE_TAG}^{commit}" "$VERIFY_SHA"; then
            CHANGED="$(bun scripts/ci-released-native.ts changed "${RELEASE_TAG}^{commit}" "$VERIFY_SHA")"
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" = true ]; then
            echo "Native inputs differ from the latest published addon; build every target from this pull request."
          else
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "Native inputs match $RELEASE_TAG; use its verified Coreforce addons."
          fi

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-14
            binary: omp-darwin-arm64
            native_targets: darwin-arm64
          - target: darwin-x64
            os: macos-15-intel
            binary: omp-darwin-x64
            native_targets: darwin-x64-baseline
          - target: linux-x64
            os: ubuntu-22.04
            binary: omp-linux-x64
            native_targets: "linux-x64-baseline linux-x64-modern"
          - target: linux-arm64
            os: ubuntu-24.04-arm
            binary: omp-linux-arm64
            native_targets: linux-arm64
          - target: win32-x64
            os: ubuntu-24.04
            cross: "1"
            binary: omp-windows-x64.exe
            native_targets: win32-x64-baseline
          - target: win32-arm64
            os: windows-11-arm
            windows: "1"
            binary: omp-windows-arm64.exe
    steps:
      - name: Download released native addon
        if: needs.prepare.outputs.native_changed != 'true' && matrix.windows != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          ASSET_NAME: coreforge-pi-natives-${{ matrix.target }}-${{ needs.prepare.outputs.release_tag }}.tgz
        run: |
          mkdir -p "$RUNNER_TEMP/released-native"
          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_NAME" \
            --pattern SHA256SUMS.txt \
            --dir "$RUNNER_TEMP/released-native" \
            -- "$RELEASE_TAG"
      - name: Download released native addon (Windows ARM64)
        if: needs.prepare.outputs.native_changed != 'true' && matrix.windows == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          ASSET_NAME: coreforge-pi-natives-${{ matrix.target }}-${{ needs.prepare.outputs.release_tag }}.tgz
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP "released-native"
          New-Item -ItemType Directory -Force $download | Out-Null
          gh release download --repo $env:GITHUB_REPOSITORY --pattern $env:ASSET_NAME --pattern SHA256SUMS.txt --dir $download -- $env:RELEASE_TAG
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: "1.4.0"
      - name: Resolve verification version
        if: matrix.windows != '1'
        run: |
          PKG="$(bun -e 'console.log(JSON.parse(await Bun.file("packages/coding-agent/package.json").text()).version)')"
          echo "VERIFY_VERSION=${PKG}.0" >> "$GITHUB_ENV"
      - name: Resolve verification version (Windows)
        if: matrix.windows == '1'
        shell: pwsh
        run: |
          $pkg = (bun -e 'console.log(JSON.parse(await Bun.file("packages/coding-agent/package.json").text()).version)').Trim()
          "VERIFY_VERSION=$pkg.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Reclaim disk for large native builds
        if: needs.prepare.outputs.native_changed == 'true' && (matrix.target == 'win32-x64' || matrix.target == 'linux-x64')
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /
      - run: bun install --frozen-lockfile
      # Pull requests can restore trusted base-branch release caches, but never
      # save multi-gigabyte merge-ref caches that sibling pull requests cannot use.
      - name: Restore Bazel native build cache
        if: needs.prepare.outputs.native_changed == 'true' && matrix.windows != '1'
        id: bazel-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/omp-bazel-disk
            ~/.cache/omp-bazel-repo
          key: coreforge-bazel-v1-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'MODULE.bazel', 'MODULE.bazel.lock', 'rust-toolchain.toml', 'rustfmt.toml', '.bazelrc', '.bazelignore', '.bazelversion', 'bazel/**', 'crates/**', 'BUILD.bazel') }}
          restore-keys: |
            coreforge-bazel-v1-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Build native addon from Coreforge sources
        if: needs.prepare.outputs.native_changed == 'true' && matrix.windows != '1'
        env:
          NATIVE_TARGETS: ${{ matrix.native_targets }}
        run: |
          set -euo pipefail
          if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
          mkdir -p "$HOME/.cache/omp-bazel-disk" "$HOME/.cache/omp-bazel-repo"
          {
            echo "common --config=ci"
            echo "common --disk_cache=$HOME/.cache/omp-bazel-disk"
            echo "common --repository_cache=$HOME/.cache/omp-bazel-repo"
          } > "$RUNNER_TEMP/coreforge-bazel.rc"
          export OMP_BAZEL_RC="$RUNNER_TEMP/coreforge-bazel.rc"
          read -r -a targets <<< "$NATIVE_TARGETS"
          bun scripts/bazel-natives.ts "${targets[@]}"
          ls packages/natives/native/*.node
      - name: Build native addon from Coreforge sources (Windows ARM64)
        if: needs.prepare.outputs.native_changed == 'true' && matrix.windows == '1'
        env:
          OMP_NATIVE_CARGO_PROFILE: ci
        run: bun scripts/bazel-natives.ts host --dest packages/natives/native
      - name: Install verified released native addon
        if: needs.prepare.outputs.native_changed != 'true'
        run: bun scripts/ci-released-native.ts install "${{ needs.prepare.outputs.release_tag }}" "${{ matrix.target }}" packages/natives/native "${{ runner.temp }}/released-native"
      - name: Package source-built native addon
        if: needs.prepare.outputs.native_changed == 'true' && matrix.windows != '1'
        run: |
          set -euo pipefail
          shopt -s nullglob
          addons=(packages/natives/native/pi_natives."${{ matrix.target }}"*.node)
          expected=1
          if [ "${{ matrix.target }}" = "linux-x64" ]; then expected=2; fi
          if [ "${#addons[@]}" -ne "$expected" ]; then
            echo "expected $expected native files for ${{ matrix.target }}, found ${#addons[@]}" >&2
            printf '  %s\n' "${addons[@]}" >&2
            exit 1
          fi
          mkdir -p release-assets/package
          cp "${addons[@]}" release-assets/package/
          archive="release-assets/coreforge-pi-natives-${{ matrix.target }}-verify.tgz"
          tar -czf "$archive" -C release-assets package
          test -s "$archive"
      - name: Package source-built native addon (Windows ARM64)
        if: needs.prepare.outputs.native_changed == 'true' && matrix.windows == '1'
        shell: pwsh
        run: |
          $addons = @(Get-ChildItem "packages/natives/native/pi_natives.win32-arm64*.node")
          if ($addons.Count -ne 1) {
            throw "expected 1 native file for win32-arm64, found $($addons.Count)"
          }
          New-Item -ItemType Directory -Force release-assets/package | Out-Null
          Copy-Item $addons[0].FullName release-assets/package/
          $archive = "release-assets/coreforge-pi-natives-win32-arm64-verify.tgz"
          tar -czf $archive -C release-assets package
          if (-not (Test-Path $archive) -or (Get-Item $archive).Length -eq 0) {
            throw "native archive is missing: $archive"
          }
      - name: Inject verification channel version
        if: matrix.windows != '1'
        run: bun scripts/set-cf-version.ts "$VERIFY_VERSION"
      - name: Inject verification channel version (Windows)
        if: matrix.windows == '1'
        shell: pwsh
        run: bun scripts/set-cf-version.ts $env:VERIFY_VERSION
      - name: Build binary
        env:
          RELEASE_TARGETS: ${{ matrix.target }}
        run: bun run ci:release:build-binaries
      - name: Smoke binary
        if: matrix.windows != '1' && matrix.cross != '1'
        run: |
          OUT="$(./packages/coding-agent/binaries/${{ matrix.binary }} --version)"
          echo "reported: $OUT"
          case "$OUT" in
            */"$VERIFY_VERSION") echo "version verified: $OUT" ;;
            *) echo "expected */$VERIFY_VERSION, got $OUT" >&2; exit 1 ;;
          esac
      - name: Smoke binary (Windows ARM64)
        if: matrix.windows == '1'
        shell: pwsh
        run: |
          $binaryPath = (Resolve-Path "packages/coding-agent/binaries/${{ matrix.binary }}").Path
          $out = (& $binaryPath --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "reported: $out"
          if (-not $out.EndsWith("/$env:VERIFY_VERSION")) {
            throw "expected */$env:VERIFY_VERSION, got $out"
          }
          & $binaryPath --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify binary asset
        if: matrix.windows != '1'
        run: test -s "packages/coding-agent/binaries/${{ matrix.binary }}"
      - name: Verify binary asset (Windows ARM64)
        if: matrix.windows == '1'
        shell: pwsh
        run: |
          $binaryPath = "packages/coding-agent/binaries/${{ matrix.binary }}"
          if (-not (Test-Path $binaryPath) -or (Get-Item $binaryPath).Length -eq 0) {
            throw "binary asset is missing: $binaryPath"
          }

  browser_relay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - name: Build Coreforge Browser Relay extension
        run: |
          bun --cwd=packages/browser-relay run build
          test -s packages/browser-relay/dist/coreforge-browser-relay-extension.zip
