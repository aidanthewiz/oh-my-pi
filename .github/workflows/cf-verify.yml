# Non-publishing release dry run for changes targeting the Coreforge engine.
# This workflow is separate from cf-release.yml so pull request code never runs
# in a job that can receive contents: write.
name: cf-verify

on:
  pull_request:
    branches:
      - coreforge

permissions:
  contents: read
  actions: read

concurrency:
  group: cf-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: classify native inputs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      native_changed: ${{ steps.native.outputs.changed }}
      release_tag: ${{ steps.native.outputs.tag }}
    steps:
      - name: List Coreforce releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 200 \
            --exclude-drafts \
            --json tagName,isDraft \
            > "$RUNNER_TEMP/coreforce-releases.json"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Install source verification dependencies
        run: bun install --frozen-lockfile
      - name: Check source before native builds
        run: bun run ci:check:full
      - name: Verify selective LLVM extraction
        run: python3 -m unittest discover -s bazel/toolchains -p test_extract_llvm.py
      - name: Verify durable cache boundaries
        run: python3 -m unittest discover -s scripts -p 'test_ci_cache*.py'
      - name: Verify required CI aggregation
        run: python3 -m unittest discover -s scripts -p 'test_ci_required.py'
      - name: Select native verification source
        id: native
        env:
          RELEASE_LIST: ${{ runner.temp }}/coreforce-releases.json
        run: |
          set -euo pipefail
          PKG_VERSION="$(bun -e 'console.log(JSON.parse(await Bun.file("packages/coding-agent/package.json").text()).version)')"
          RELEASE_TAG="$(bun scripts/ci-released-native.ts resolve-optional "$PKG_VERSION" "$RELEASE_LIST")"
          VERIFY_SHA="$(git rev-parse HEAD)"
          CHANGED=true
          if [ -n "$RELEASE_TAG" ] && git merge-base --is-ancestor "${RELEASE_TAG}^{commit}" "$VERIFY_SHA"; then
            CHANGED="$(bun scripts/ci-released-native.ts changed "${RELEASE_TAG}^{commit}" "$VERIFY_SHA")"
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" = true ]; then
            echo "Native inputs differ from the latest published addon; build every target from this pull request."
          else
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "Native inputs match $RELEASE_TAG; use its verified Coreforce addons."
          fi

  cache_restore:
    needs: prepare
    if: vars.CI_CACHE_ENABLED == 'true' && needs.prepare.outputs.native_changed == 'true'
    uses: Coreforce-CAD/oh-my-pi/.github/workflows/cf-cache-read.yml@c4d074b6ef60c229874d0fda96740cd71877f94c
    with:
      enabled: true
      slots: '["darwin-arm64-xcode-27","darwin-x64-macos-15-intel","linux-x64-ubuntu-22.04","linux-arm64-ubuntu-24.04-arm","linux-musl-x64-ubuntu-22.04","linux-musl-arm64-ubuntu-24.04-arm","win32-x64-ubuntu-24.04"]'
    permissions:
      contents: read
      actions: read
      id-token: write

  build:
    name: native / ${{ matrix.target }}
    needs: [prepare, cache_restore]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: xcode-27
            binary: omp-darwin-arm64
            native_targets: darwin-arm64
            qualification_os: xcode-27
          - target: darwin-x64
            os: macos-15-intel
            binary: omp-darwin-x64
            native_targets: darwin-x64-baseline
          - target: linux-x64
            os: ubuntu-22.04
            binary: omp-linux-x64
            native_targets: "linux-x64-baseline linux-x64-modern"
            qualification_os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
            binary: omp-linux-arm64
            native_targets: linux-arm64
          - target: linux-musl-x64
            os: ubuntu-22.04
            cross: "1"
            binary: omp-linux-musl-x64
            native_targets: linux-musl-x64-baseline
          - target: linux-musl-arm64
            os: ubuntu-24.04-arm
            cross: "1"
            binary: omp-linux-musl-arm64
            native_targets: linux-musl-arm64
          - target: win32-x64
            os: ubuntu-24.04
            cross: "1"
            binary: omp-windows-x64.exe
            native_targets: win32-x64-baseline
          - target: win32-arm64
            os: windows-11-arm
            windows: "1"
            binary: omp-windows-arm64.exe
    uses: ./.github/workflows/cf-verify-target.yml
    with:
      source-sha: ${{ github.event.pull_request.head.sha }}
      native-changed: ${{ needs.prepare.outputs.native_changed == 'true' }}
      release-tag: ${{ needs.prepare.outputs.release_tag }}
      target: ${{ matrix.target }}
      runner: ${{ matrix.os }}
      binary: ${{ matrix.binary }}
      native-targets: ${{ matrix.native_targets || '' }}
      cross: ${{ matrix.cross == '1' }}
      windows: ${{ matrix.windows == '1' }}
      qualification-runner: ${{ matrix.qualification_os || '' }}
    permissions:
      contents: read
      actions: read

  browser_relay:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Build Coreforge Browser Relay extension
        run: |
          bun --cwd=packages/browser-relay run build
          test -s packages/browser-relay/dist/coreforge-browser-relay-extension.zip

  required:
    name: required CI
    needs: [prepare, build, browser_relay]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require every CI dependency
        run: python3 scripts/ci-required.py prepare build browser_relay
