# Non-publishing release dry run for changes targeting the Coreforge engine.
# This workflow is separate from cf-release.yml so pull request code never runs
# in a job that can receive contents: write.
name: cf-verify

on:
  pull_request:
    branches:
      - coreforge

permissions:
  contents: read
  actions: read

concurrency:
  group: cf-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan verified PR scope
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
      source_sha: ${{ steps.scope.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the exact PR with the base revision policy
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git --no-replace-objects rev-parse --verify HEAD)" = "$SOURCE_SHA"
          test "$(git --no-replace-objects rev-parse --verify "${BASE_SHA}^{commit}")" = "$BASE_SHA"
          if git --no-replace-objects cat-file -e "${BASE_SHA}:scripts/ci_pr_scope.py"; then
            git --no-replace-objects show "${BASE_SHA}:scripts/ci_pr_scope.py" > "$RUNNER_TEMP/ci_pr_scope.py"
            python3 "$RUNNER_TEMP/ci_pr_scope.py" "$BASE_SHA" "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "No base revision scope policy; require full verification."
            echo "scope=full" >> "$GITHUB_OUTPUT"
          fi
          printf 'base_sha=%s\nsource_sha=%s\n' "$BASE_SHA" "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  prepare:
    name: Source checks and native inputs
    needs: plan
    if: needs.plan.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    outputs:
      native_changed: ${{ steps.native.outputs.changed }}
      release_tag: ${{ steps.native.outputs.tag }}
    steps:
      - name: List Coreforce releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 200 \
            --exclude-drafts \
            --json tagName,isDraft \
            > "$RUNNER_TEMP/coreforce-releases.json"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Install source verification dependencies
        run: bun install --frozen-lockfile
      - name: Verify qualification and release helpers
        run: bun test --no-env-file scripts/ci-qualification-engine.test.ts scripts/ci-release-smoke.test.ts
      - name: Check source before native builds
        run: bun run ci:check:full
      - name: Verify selective LLVM extraction
        run: python3 -m unittest discover -s bazel/toolchains -p test_extract_llvm.py
      - name: Verify durable cache boundaries
        run: python3 -m unittest discover -s scripts -p 'test_ci_cache*.py'
      - name: Verify required CI aggregation
        run: python3 -m unittest discover -s scripts -p 'test_ci_required.py'
      - name: Verify pull request scope classification
        run: python3 -m unittest discover -s scripts -p 'test_ci_pr_scope.py'
      - name: Verify automatic release admission
        run: python3 -m unittest discover -s scripts -p 'test_ci_release_admission.py'
      - name: Select native verification source
        id: native
        env:
          RELEASE_LIST: ${{ runner.temp }}/coreforce-releases.json
        run: |
          set -euo pipefail
          PKG_VERSION="$(bun -e 'console.log(JSON.parse(await Bun.file("packages/coding-agent/package.json").text()).version)')"
          RELEASE_TAG="$(bun scripts/ci-released-native.ts resolve-optional "$PKG_VERSION" "$RELEASE_LIST")"
          VERIFY_SHA="$(git rev-parse HEAD)"
          CHANGED=true
          if [ -n "$RELEASE_TAG" ] && git merge-base --is-ancestor "${RELEASE_TAG}^{commit}" "$VERIFY_SHA"; then
            CHANGED="$(bun scripts/ci-released-native.ts changed "${RELEASE_TAG}^{commit}" "$VERIFY_SHA")"
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" = true ]; then
            echo "Native inputs differ from the latest published addon; build every target from this pull request."
          else
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "Native inputs match $RELEASE_TAG; use its verified Coreforce addons."
          fi

  cache_restore:
    name: Restore build caches
    needs: prepare
    if: vars.CI_CACHE_ENABLED == 'true' && needs.prepare.outputs.native_changed == 'true'
    uses: Coreforce-CAD/oh-my-pi/.github/workflows/cf-cache-read.yml@c4d074b6ef60c229874d0fda96740cd71877f94c
    with:
      enabled: true
      slots: '["darwin-arm64-xcode-27","darwin-x64-macos-15-intel","linux-x64-ubuntu-22.04","linux-arm64-ubuntu-24.04-arm","linux-musl-x64-ubuntu-22.04","linux-musl-arm64-ubuntu-24.04-arm","win32-x64-ubuntu-24.04"]'
    permissions:
      contents: read
      actions: read
      id-token: write

  darwin_arm64:
    name: macOS ARM64
    needs: [prepare, cache_restore]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/cf-verify-target.yml
    with:
      source-sha: ${{ github.event.pull_request.head.sha }}
      native-changed: ${{ needs.prepare.outputs.native_changed == 'true' }}
      release-tag: ${{ needs.prepare.outputs.release_tag }}
      target: darwin-arm64
      runner: xcode-27
      binary: omp-darwin-arm64
      native-targets: darwin-arm64
      qualification-runner: xcode-27
    permissions:
      contents: read
      actions: read

  darwin_x64:
    name: macOS x64
    needs: [prepare, cache_restore]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/cf-verify-target.yml
    with:
      source-sha: ${{ github.event.pull_request.head.sha }}
      native-changed: ${{ needs.prepare.outputs.native_changed == 'true' }}
      release-tag: ${{ needs.prepare.outputs.release_tag }}
      target: darwin-x64
      runner: macos-15-intel
      binary: omp-darwin-x64
      native-targets: darwin-x64-baseline
    permissions:
      contents: read
      actions: read

  linux_x64:
    name: Linux x64
    needs: [prepare, cache_restore]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/cf-verify-target.yml
    with:
      source-sha: ${{ github.event.pull_request.head.sha }}
      native-changed: ${{ needs.prepare.outputs.native_changed == 'true' }}
      release-tag: ${{ needs.prepare.outputs.release_tag }}
      target: linux-x64
      runner: ubuntu-22.04
      binary: omp-linux-x64
      native-targets: linux-x64-baseline linux-x64-modern
      qualification-runner: ubuntu-26.04
    permissions:
      contents: read
      actions: read

  linux_arm64:
    name: Linux ARM64
    needs: [prepare, cache_restore]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/cf-verify-target.yml
    with:
      source-sha: ${{ github.event.pull_request.head.sha }}
      native-changed: ${{ needs.prepare.outputs.native_changed == 'true' }}
      release-tag: ${{ needs.prepare.outputs.release_tag }}
      target: linux-arm64
      runner: ubuntu-24.04-arm
      binary: omp-linux-arm64
      native-targets: linux-arm64
    permissions:
      contents: read
      actions: read

  linux_musl_x64:
    name: Linux musl x64
    needs: [prepare, cache_restore]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/cf-verify-target.yml
    with:
      source-sha: ${{ github.event.pull_request.head.sha }}
      native-changed: ${{ needs.prepare.outputs.native_changed == 'true' }}
      release-tag: ${{ needs.prepare.outputs.release_tag }}
      target: linux-musl-x64
      runner: ubuntu-22.04
      binary: omp-linux-musl-x64
      native-targets: linux-musl-x64-baseline
      cross: true
    permissions:
      contents: read
      actions: read

  linux_musl_arm64:
    name: Linux musl ARM64
    needs: [prepare, cache_restore]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/cf-verify-target.yml
    with:
      source-sha: ${{ github.event.pull_request.head.sha }}
      native-changed: ${{ needs.prepare.outputs.native_changed == 'true' }}
      release-tag: ${{ needs.prepare.outputs.release_tag }}
      target: linux-musl-arm64
      runner: ubuntu-24.04-arm
      binary: omp-linux-musl-arm64
      native-targets: linux-musl-arm64
      cross: true
    permissions:
      contents: read
      actions: read

  win32_x64:
    name: Windows x64
    needs: [prepare, cache_restore]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/cf-verify-target.yml
    with:
      source-sha: ${{ github.event.pull_request.head.sha }}
      native-changed: ${{ needs.prepare.outputs.native_changed == 'true' }}
      release-tag: ${{ needs.prepare.outputs.release_tag }}
      target: win32-x64
      runner: ubuntu-24.04
      binary: omp-windows-x64.exe
      native-targets: win32-x64-baseline
      cross: true
    permissions:
      contents: read
      actions: read

  win32_arm64:
    name: Windows ARM64
    needs: [prepare, cache_restore]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/cf-verify-target.yml
    with:
      source-sha: ${{ github.event.pull_request.head.sha }}
      native-changed: ${{ needs.prepare.outputs.native_changed == 'true' }}
      release-tag: ${{ needs.prepare.outputs.release_tag }}
      target: win32-arm64
      runner: windows-11-arm
      binary: omp-windows-arm64.exe
      windows: true
    permissions:
      contents: read
      actions: read

  browser_relay:
    name: Build browser extension
    needs: plan
    if: needs.plan.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Build Coreforge Browser Relay extension
        run: |
          bun --cwd=packages/browser-relay run build
          test -s packages/browser-relay/dist/coreforge-browser-relay-extension.zip

  required:
    name: required CI
    needs: [plan, prepare, darwin_arm64, darwin_x64, linux_x64, linux_arm64, linux_musl_x64, linux_musl_arm64, win32_x64, win32_arm64, browser_relay]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      NEEDS: ${{ toJSON(needs) }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require the verified CI plan
        run: python3 scripts/ci-required.py "$BASE_SHA" "$SOURCE_SHA"
