name: relay

on:
  pull_request:
    branches:
      - coreforge
    paths:
      - ".github/workflows/relay.yml"
      - "Dockerfile.relay"
      - "Dockerfile.relay.dockerignore"
      - "bun.lock"
      - "package.json"
      - "scripts/ci-released-native.ts"
      - "packages/collab-web/**"
      - "packages/coding-agent/scripts/generate-share-viewer.ts"
      - "packages/coding-agent/src/cli-commands.ts"
      - "packages/coding-agent/src/cli/relay-cli.ts"
      - "packages/coding-agent/src/commands/relay.ts"
      - "packages/coding-agent/src/config/settings-schema.ts"
      - "packages/coding-agent/src/export/share.ts"
      - "packages/coding-agent/src/identity/relay.ts"
      - "packages/coding-agent/src/modes/controllers/command-controller.ts"
      - "packages/coding-agent/src/slash-commands/builtin-registry.ts"
      - "packages/coding-agent/src/collab/**"
      - "packages/coding-agent/src/export/html/**"
      - "packages/relay/**"
      - "packages/wire/**"
  push:
    tags:
      - "relay/v*"

permissions:
  contents: read

jobs:
  prepare:
    name: classify native inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      native_changed: ${{ steps.native.outputs.changed }}
      release_tag: ${{ steps.native.outputs.tag }}
    steps:
      - name: List Coreforce releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 200 \
            --exclude-drafts \
            --json tagName,isDraft \
            > "$RUNNER_TEMP/coreforce-releases.json"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Select native verification source
        id: native
        env:
          RELEASE_LIST: ${{ runner.temp }}/coreforce-releases.json
        run: |
          set -euo pipefail
          PKG_VERSION="$(bun -e 'console.log(JSON.parse(await Bun.file("packages/coding-agent/package.json").text()).version)')"
          RELEASE_TAG="$(bun scripts/ci-released-native.ts resolve-optional "$PKG_VERSION" "$RELEASE_LIST")"
          VERIFY_SHA="$(git rev-parse HEAD)"
          CHANGED=true
          if [ -n "$RELEASE_TAG" ] && git merge-base --is-ancestor "${RELEASE_TAG}^{commit}" "$VERIFY_SHA"; then
            CHANGED="$(bun scripts/ci-released-native.ts changed "${RELEASE_TAG}^{commit}" "$VERIFY_SHA")"
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" = false ]; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          fi

  cache_restore:
    needs: prepare
    if: vars.CI_CACHE_ENABLED == 'true' && needs.prepare.outputs.native_changed == 'true'
    uses: Coreforce-CAD/oh-my-pi/.github/workflows/cf-cache-read.yml@c4d074b6ef60c229874d0fda96740cd71877f94c
    with:
      enabled: true
      slots: '["linux-x64-ubuntu-24.04"]'
    permissions:
      contents: read
      actions: read
      id-token: write

  validate:
    name: validate
    needs: [prepare, cache_restore]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Download released Coreforce native addon
        if: needs.prepare.outputs.native_changed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          ASSET_NAME: coreforge-pi-natives-linux-x64-${{ needs.prepare.outputs.release_tag }}.tgz
        run: |
          mkdir -p "$RUNNER_TEMP/released-native"
          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_NAME" \
            --pattern SHA256SUMS.txt \
            --dir "$RUNNER_TEMP/released-native" \
            -- "$RELEASE_TAG"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check relay clients
        run: |
          bun --cwd=packages/wire run check
          bun --cwd=packages/collab-web run check
          bun --cwd=packages/coding-agent run check

      - name: Reclaim disk for source native build
        if: needs.prepare.outputs.native_changed == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install verified Coreforce native addon
        if: needs.prepare.outputs.native_changed != 'true'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: bun scripts/ci-released-native.ts install "$RELEASE_TAG" linux-x64 packages/natives/native "$RUNNER_TEMP/released-native"

      - name: Identify compatible Bazel caches
        if: needs.prepare.outputs.native_changed == 'true'
        id: cache-identity
        continue-on-error: true
        run: python3 scripts/ci_cache.py identity --slot linux-x64-ubuntu-24.04 --output "$RUNNER_TEMP/cache-identity.json"
      - name: Download durable Bazel snapshot
        if: needs.prepare.outputs.native_changed == 'true' && vars.CI_CACHE_ENABLED == 'true'
        id: cache-download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cache-restore-linux-x64-ubuntu-24.04
          path: ${{ runner.temp }}/cache-restore
      - name: Restore durable Bazel snapshot
        if: steps.cache-identity.outcome == 'success' && steps.cache-download.outcome == 'success'
        id: cache-restore
        continue-on-error: true
        run: |
          python3 scripts/ci_cache.py restore --identity "$RUNNER_TEMP/cache-identity.json" \
            --snapshot "$RUNNER_TEMP/cache-restore" \
            --disk "$HOME/.cache/omp-bazel-disk" --repo "$HOME/.cache/omp-bazel-repo"
      - name: Report unavailable durable cache
        if: steps.cache-identity.outcome == 'failure' || steps.cache-download.outcome == 'failure' || steps.cache-restore.outcome == 'failure'
        run: echo "::warning::Bazel snapshot unavailable; required native build will run with compatible hot cache or cold inputs."
      - name: Restore compatible GitHub hot cache
        if: steps.cache-identity.outcome == 'success' && steps.cache-restore.outputs.hit != 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/omp-bazel-disk
            ~/.cache/omp-bazel-repo
          key: coreforge-bazel-v2-${{ steps.cache-identity.outputs.key }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'MODULE.bazel', 'MODULE.bazel.lock', 'rust-toolchain.toml', 'rustfmt.toml', '.bazelrc', '.bazelignore', '.bazelversion', 'bazel/**', 'crates/**', 'BUILD.bazel') }}
          restore-keys: |
            coreforge-bazel-v2-${{ steps.cache-identity.outputs.key }}-

      - name: Build native addon from Coreforge sources
        if: needs.prepare.outputs.native_changed == 'true'
        run: |
          set -euo pipefail
          if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
          mkdir -p "$HOME/.cache/omp-bazel-disk" "$HOME/.cache/omp-bazel-repo"
          {
            echo "common --config=ci"
            echo "common --disk_cache=$HOME/.cache/omp-bazel-disk"
            echo "common --repository_cache=$HOME/.cache/omp-bazel-repo"
          } > "$RUNNER_TEMP/coreforge-bazel.rc"
          export OMP_BAZEL_RC="$RUNNER_TEMP/coreforge-bazel.rc"
          bun scripts/bazel-natives.ts linux-x64-baseline linux-x64-modern

      - name: Prepare durable cache candidate before reclaiming native outputs
        if: success() && github.event_name == 'push' && needs.prepare.outputs.native_changed == 'true' && vars.CI_CACHE_ENABLED == 'true' && steps.cache-identity.outcome == 'success'
        id: cache-pack
        continue-on-error: true
        run: |
          BAZEL="$(command -v bazelisk || command -v bazel)"
          "$BAZEL" --bazelrc="$RUNNER_TEMP/coreforge-bazel.rc" shutdown
          python3 scripts/ci_cache.py pack --identity "$RUNNER_TEMP/cache-identity.json" \
            --disk "$HOME/.cache/omp-bazel-disk" --repo "$HOME/.cache/omp-bazel-repo" \
            --output "$RUNNER_TEMP/cache-snapshot"

      - name: Reclaim completed native build outputs
        if: needs.prepare.outputs.native_changed == 'true'
        run: |
          set -euo pipefail
          df -h /
          rm -rf "$HOME/.cache/omp-bazel-disk" "$HOME/.cache/omp-bazel-repo"
          BAZEL="$(command -v bazelisk || command -v bazel)"
          "$BAZEL" --bazelrc="$RUNNER_TEMP/coreforge-bazel.rc" clean --expunge
          df -h /

      - name: Test relay clients
        run: |
          bun test packages/coding-agent/test/relay-identity.test.ts packages/coding-agent/test/share.test.ts packages/coding-agent/test/collab/relay-client-backpressure.test.ts
          bun --cwd=packages/collab-web run test

      - name: Check relay package
        run: bun --cwd=packages/relay run check

      - name: Test relay package
        run: bun --cwd=packages/relay run test

      - name: Build browser clients and relay
        run: |
          bun --cwd=packages/collab-web run build
          bun packages/coding-agent/scripts/generate-share-viewer.ts /tmp/share-viewer.html
          bun --cwd=packages/relay run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build relay image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.relay
          push: false
          platforms: linux/amd64

      - name: Retain validated native addons for publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-native-linux-x64
          path: packages/natives/native/pi_natives.linux-x64*.node
          if-no-files-found: error
          retention-days: 1

      - name: Download retained native addons for verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relay-native-linux-x64
          path: ${{ runner.temp }}/relay-native-roundtrip

      - name: Verify native artifact contents
        run: |
          cmp packages/natives/native/pi_natives.linux-x64-baseline.node "$RUNNER_TEMP/relay-native-roundtrip/pi_natives.linux-x64-baseline.node"
          cmp packages/natives/native/pi_natives.linux-x64-modern.node "$RUNNER_TEMP/relay-native-roundtrip/pi_natives.linux-x64-modern.node"
      - name: Retain successful relay cache candidate
        if: success() && steps.cache-pack.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-linux-x64-ubuntu-24.04
          path: ${{ runner.temp }}/cache-snapshot
          retention-days: 1
          if-no-files-found: error

  cache_publish:
    needs: [prepare, validate, publish]
    if: ${{ !cancelled() && vars.CI_CACHE_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/relay/v') && needs.prepare.result == 'success' && needs.prepare.outputs.native_changed == 'true' && needs.validate.result == 'success' && needs.publish.result == 'success' }}
    uses: Coreforce-CAD/oh-my-pi/.github/workflows/cf-cache-write.yml@c4d074b6ef60c229874d0fda96740cd71877f94c
    with:
      enabled: true
      source-sha: ${{ github.sha }}
      expected-workflow: relay
      build-result: ${{ needs.validate.result }}
    permissions:
      contents: read
      actions: read
      id-token: write

  publish:
    name: publish
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/relay/v') && needs.validate.result == 'success' }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_USE_FIPS_ENDPOINT: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard tag and package version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/coreforge" --jq .object.sha)"
          if [ "${tag_commit}" != "${tip}" ]; then
            echo "tag commit ${tag_commit} is not the coreforge tip ${tip}" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#relay/v}"
          package_version="$(jq -r .version packages/relay/package.json)"
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          if [[ ! "${version}" =~ ${semver_re} ]] || [ "${#version}" -gt 128 ] || [ "${version}" != "${package_version}" ]; then
            echo "tag version ${version} must be Docker-compatible SemVer without build metadata and equal relay package ${package_version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Download validated Coreforce native addons
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relay-native-linux-x64
          path: packages/natives/native

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          translate-env-variables: false
          role-to-assume: arn:aws-us-gov:iam::800128555654:role/SomaPlatformProdRelayPublish
          aws-region: us-gov-west-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity --output json

      - name: Log in to ECR
        id: ecr
        shell: bash
        run: |
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.us-gov-west-1.amazonaws.com"
          echo "registry=${registry}" >> "$GITHUB_OUTPUT"
          aws ecr get-login-password --region us-gov-west-1 | docker login --username AWS --password-stdin "${registry}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push relay image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.relay
          push: true
          platforms: linux/amd64
          tags: ${{ steps.ecr.outputs.registry }}/apps/omp-relay:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/Coreforce-CAD/oh-my-pi
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v3.1.3"

      - name: Sign and verify image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/apps/omp-relay@${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          cosign sign --yes "${IMAGE}"
          cosign verify \
            --certificate-identity-regexp 'https://github\.com/Coreforce-CAD/oh-my-pi/\.github/workflows/relay\.yml@refs/tags/relay/v.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}"
