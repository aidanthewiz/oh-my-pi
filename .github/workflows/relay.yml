name: relay

on:
  pull_request:
    branches:
      - coreforge
    paths:
      - ".github/workflows/relay.yml"
      - "Dockerfile.relay"
      - "Dockerfile.relay.dockerignore"
      - "bun.lock"
      - "package.json"
      - "scripts/ci-released-native.ts"
      - "packages/collab-web/**"
      - "packages/coding-agent/scripts/generate-share-viewer.ts"
      - "packages/coding-agent/src/cli-commands.ts"
      - "packages/coding-agent/src/cli/relay-cli.ts"
      - "packages/coding-agent/src/commands/relay.ts"
      - "packages/coding-agent/src/config/settings-schema.ts"
      - "packages/coding-agent/src/export/share.ts"
      - "packages/coding-agent/src/identity/relay.ts"
      - "packages/coding-agent/src/modes/controllers/command-controller.ts"
      - "packages/coding-agent/src/slash-commands/builtin-registry.ts"
      - "packages/coding-agent/src/collab/**"
      - "packages/coding-agent/src/export/html/**"
      - "packages/relay/**"
      - "packages/wire/**"
  push:
    tags:
      - "relay/v*"

permissions:
  contents: read

jobs:
  prepare:
    name: classify native inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      native_changed: ${{ steps.native.outputs.changed }}
      release_tag: ${{ steps.native.outputs.tag }}
    steps:
      - name: List Coreforce releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 200 \
            --exclude-drafts \
            --json tagName,isDraft \
            > "$RUNNER_TEMP/coreforce-releases.json"
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: "1.4.2"
      - name: Select native verification source
        id: native
        env:
          RELEASE_LIST: ${{ runner.temp }}/coreforce-releases.json
        run: |
          set -euo pipefail
          PKG_VERSION="$(bun -e 'console.log(JSON.parse(await Bun.file("packages/coding-agent/package.json").text()).version)')"
          RELEASE_TAG="$(bun scripts/ci-released-native.ts resolve-optional "$PKG_VERSION" "$RELEASE_LIST")"
          VERIFY_SHA="$(git rev-parse HEAD)"
          CHANGED=true
          if [ -n "$RELEASE_TAG" ] && git merge-base --is-ancestor "${RELEASE_TAG}^{commit}" "$VERIFY_SHA"; then
            CHANGED="$(bun scripts/ci-released-native.ts changed "${RELEASE_TAG}^{commit}" "$VERIFY_SHA")"
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" = false ]; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: validate
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Download released Coreforce native addon
        if: needs.prepare.outputs.native_changed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          ASSET_NAME: coreforge-pi-natives-linux-x64-${{ needs.prepare.outputs.release_tag }}.tgz
        run: |
          mkdir -p "$RUNNER_TEMP/released-native"
          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_NAME" \
            --pattern SHA256SUMS.txt \
            --dir "$RUNNER_TEMP/released-native" \
            -- "$RELEASE_TAG"
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install verified Coreforce native addon
        if: needs.prepare.outputs.native_changed != 'true'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: bun scripts/ci-released-native.ts install "$RELEASE_TAG" linux-x64 packages/natives/native "$RUNNER_TEMP/released-native"

      - name: Restore Bazel native build cache
        if: needs.prepare.outputs.native_changed == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/omp-bazel-disk
            ~/.cache/omp-bazel-repo
          key: coreforge-bazel-v1-linux-x64-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'MODULE.bazel', 'MODULE.bazel.lock', 'rust-toolchain.toml', 'rustfmt.toml', '.bazelrc', '.bazelignore', '.bazelversion', 'bazel/**', 'crates/**', 'BUILD.bazel') }}
          restore-keys: |
            coreforge-bazel-v1-linux-x64-${{ runner.os }}-${{ runner.arch }}-

      - name: Build native addon from Coreforge sources
        if: needs.prepare.outputs.native_changed == 'true'
        run: |
          set -euo pipefail
          if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
          mkdir -p "$HOME/.cache/omp-bazel-disk" "$HOME/.cache/omp-bazel-repo"
          {
            echo "common --config=ci"
            echo "common --disk_cache=$HOME/.cache/omp-bazel-disk"
            echo "common --repository_cache=$HOME/.cache/omp-bazel-repo"
          } > "$RUNNER_TEMP/coreforge-bazel.rc"
          export OMP_BAZEL_RC="$RUNNER_TEMP/coreforge-bazel.rc"
          bun scripts/bazel-natives.ts linux-x64-baseline linux-x64-modern

      - name: Check relay clients
        run: |
          bun --cwd=packages/wire run check
          bun --cwd=packages/collab-web run check
          bun --cwd=packages/coding-agent run check

      - name: Test relay clients
        run: |
          bun test packages/coding-agent/test/relay-identity.test.ts packages/coding-agent/test/share.test.ts packages/coding-agent/test/collab/relay-client-backpressure.test.ts
          bun --cwd=packages/collab-web run test

      - name: Check relay package
        run: bun --cwd=packages/relay run check

      - name: Test relay package
        run: bun --cwd=packages/relay run test

      - name: Build browser clients and relay
        run: |
          bun --cwd=packages/collab-web run build
          bun packages/coding-agent/scripts/generate-share-viewer.ts /tmp/share-viewer.html
          bun --cwd=packages/relay run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build relay image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: Dockerfile.relay
          push: false
          platforms: linux/amd64

      - name: Retain validated native addons for publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relay-native-linux-x64
          path: packages/natives/native/pi_natives.linux-x64*.node
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/relay/v')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_USE_FIPS_ENDPOINT: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard tag and package version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/coreforge" --jq .object.sha)"
          if [ "${tag_commit}" != "${tip}" ]; then
            echo "tag commit ${tag_commit} is not the coreforge tip ${tip}" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#relay/v}"
          package_version="$(jq -r .version packages/relay/package.json)"
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          if [[ ! "${version}" =~ ${semver_re} ]] || [ "${#version}" -gt 128 ] || [ "${version}" != "${package_version}" ]; then
            echo "tag version ${version} must be Docker-compatible SemVer without build metadata and equal relay package ${package_version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Download validated Coreforce native addons
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: relay-native-linux-x64
          path: packages/natives/native

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: arn:aws-us-gov:iam::800128555654:role/SomaPlatformProdRelayPublish
          aws-region: us-gov-west-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity --output json

      - name: Log in to ECR
        id: ecr
        shell: bash
        run: |
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.us-gov-west-1.amazonaws.com"
          echo "registry=${registry}" >> "$GITHUB_OUTPUT"
          aws ecr get-login-password --region us-gov-west-1 | docker login --username AWS --password-stdin "${registry}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and push relay image
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: Dockerfile.relay
          push: true
          platforms: linux/amd64
          tags: ${{ steps.ecr.outputs.registry }}/apps/omp-relay:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/Coreforce-CAD/oh-my-pi
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.1"

      - name: Sign and verify image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/apps/omp-relay@${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          cosign sign --yes "${IMAGE}"
          cosign verify \
            --certificate-identity-regexp 'https://github\.com/Coreforce-CAD/oh-my-pi/\.github/workflows/relay\.yml@refs/tags/relay/v.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}"
